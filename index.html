<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#3b1d8f">
<title>PRA Props</title>
<style>
:root{color-scheme:light dark;--bg:#fff6f0;--card:#fff;--fg:#231433;--mu:#7d6b8d;--bd:#f1e4ee;--sub:#f9edf6;--up:#059669;--dn:#e11d48;--upb:#d9f7ea;--dnb:#ffe0e7;--sh:rgba(124,58,237,.14);
--t:#0891b2;--a:#f97316;--f:#c026d3;--l:#d97706;--m:#7c3aed;--n:#2563eb}
@media(prefers-color-scheme:dark){:root{--bg:#140f1f;--card:#1e1731;--fg:#f6f0ff;--mu:#a597bd;--bd:#2f2548;--sub:#2a2142;--up:#34d399;--dn:#fb7185;--upb:#11382c;--dnb:#42202b;--sh:rgba(0,0,0,.4);
--t:#22d3ee;--a:#ff9f43;--f:#e879f9;--l:#fbbf24;--m:#a78bfa;--n:#60a5fa}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.35 ui-rounded,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.hero{background:linear-gradient(135deg,#3b1d8f,#c026d3 62%,#ff7a18);color:#fff;padding:calc(env(safe-area-inset-top) + 20px) 18px 20px;border-radius:0 0 30px 30px}
h1{margin:0;font-size:34px;font-weight:800;letter-spacing:-1px}.sea{font-size:13px;opacity:.9;margin:0}
.hg{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;column-gap:12px;row-gap:3px;align-items:center;margin-bottom:16px}
.upd{justify-self:end;font-size:11px;white-space:nowrap;opacity:.92}.upd span::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:#4ade80;margin-right:6px;vertical-align:1px}
#q{width:100%;font:inherit;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);border-radius:14px;padding:11px 14px}
#q::placeholder{color:rgba(255,255,255,.8)}#q:focus{outline:2px solid #fff}
.bar{display:flex;gap:8px;flex-wrap:wrap;padding:14px 16px 8px;align-items:center}
.bar select,.bar input{font:inherit;font-size:16px;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 10px}
.bar label{display:flex;align-items:center;gap:6px;color:var(--mu);font-size:13px}.bar label input{width:62px}
.panel{margin:4px 12px 14px;background:var(--card);border-radius:22px;box-shadow:0 10px 32px var(--sh);overflow:hidden}
#w{overflow:auto;max-height:74vh}table{border-collapse:separate;border-spacing:0;white-space:nowrap;font-variant-numeric:tabular-nums}
th,td{padding:10px 11px;text-align:right;border-bottom:1px solid var(--bd)}
th{position:sticky;top:0;z-index:2;background:var(--card);font-size:12px;font-weight:700;color:var(--gc,var(--mu));border-bottom:3px solid var(--gc,var(--bd))}
th.sb{cursor:pointer}th.on{background:var(--sub)}
td{background:var(--tint,transparent)}
.gt{--gc:var(--t);--tint:color-mix(in srgb,var(--t) 9%,transparent)}.ga{--gc:var(--a);--tint:color-mix(in srgb,var(--a) 9%,transparent)}
.gf{--gc:var(--f)}.gl{--gc:var(--l);--tint:color-mix(in srgb,var(--l) 11%,transparent)}.gm{--gc:var(--m)}.gn{--gc:var(--n)}
td:first-child,th:first-child{position:sticky;left:0;z-index:3;text-align:left;background:var(--card);box-shadow:1px 0 0 var(--bd)}th:first-child{z-index:4}
tr:last-child td{border-bottom:0}
.who{display:flex;align-items:center;gap:9px}.av{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:800}
.n{font-weight:700;font-size:14px;white-space:nowrap}.no{flex:none;width:22px;text-align:right;color:var(--mu);font-size:12px;font-weight:600}.mu{color:var(--mu);font-size:12px}
.ln{width:60px;font:inherit;font-weight:600;text-align:center;color:var(--fg);background:var(--card);border:2px solid var(--t);border-radius:11px;padding:5px}.ln:focus{outline:0;box-shadow:0 0 0 3px color-mix(in srgb,var(--t) 30%,transparent)}
.pc{display:inline-block;min-width:44px;padding:3px 8px;border-radius:9px;font-weight:700;text-align:center;background:var(--sub)}
.pc.up,.pl.up{background:var(--upb);color:var(--up)}.pc.dn,.pl.dn{background:var(--dnb);color:var(--dn)}.pc small{font-weight:500;opacity:.75}
.pl{padding:3px 9px;border-radius:99px;font-weight:700}.av2{color:var(--a);font-weight:800;font-size:16px}
.rk{padding:2px 7px;border-radius:99px;font-size:12px;font-weight:700;background:var(--sub)}.rk.up{background:var(--upb);color:var(--up)}.rk.dn{background:var(--dnb);color:var(--dn)}
.note{padding:0 18px 22px;color:var(--mu);font-size:12px;max-width:620px}
#o{position:fixed;inset:0;background:rgba(20,10,40,.55);display:none;align-items:flex-end;z-index:9}
.sh{background:var(--bg);width:100%;max-height:90vh;overflow:auto;border-radius:26px 26px 0 0;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sh .hd{background:linear-gradient(135deg,#3b1d8f,#c026d3 65%,#ff7a18);color:#fff;padding:18px 18px 16px;display:flex;justify-content:space-between;align-items:center}
.hd b{font-size:22px;font-weight:800}.x{border:0;background:rgba(255,255,255,.25);color:#fff;border-radius:99px;width:34px;height:34px;font-size:16px}
.bd{padding:14px 14px calc(18px + env(safe-area-inset-bottom))}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.tl{background:var(--card);border-radius:14px;padding:9px 11px;border-left:4px solid var(--c)}.tl div:first-child{color:var(--mu);font-size:12px}.tl div:last-child{font-weight:700;font-size:16px}
.sh table{width:100%;background:var(--card);border-radius:14px}.sh th,.sh td{text-align:center;padding:8px 4px;background:none;position:static;border-bottom:1px solid var(--bd)}.sh th{color:var(--mu);border-bottom:1px solid var(--bd)}
.hb{justify-self:end;font:inherit;font-weight:700;font-size:13px;color:#3b1d8f;background:#fff;border:0;border-radius:99px;padding:7px 14px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.hp{background:var(--card);border-left:4px solid var(--c);border-radius:14px;padding:10px 12px;margin-bottom:8px}.hp b{display:block;margin-bottom:2px}.hp span{color:var(--mu);font-size:13.5px}
.hp i{font-style:normal;font-weight:700}.hh{font-weight:800;font-size:17px;margin:14px 2px 8px}
.chip{font:inherit;font-size:14px;font-weight:600;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:9px 13px}
.chip.on{background:linear-gradient(135deg,#c026d3,#ff7a18);color:#fff;border-color:transparent}
.tg{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.tb{font:inherit;font-weight:700;color:var(--fg);background:var(--card);border:2px solid transparent;border-radius:14px;padding:8px 0;display:grid;place-items:center}
.tb.on{border-color:var(--a)}.tb.all{grid-column:1/-1;padding:11px}
.tm{color:var(--a);font-weight:700}
.ls{display:inline-block;min-width:66px;text-align:center;padding:3px 10px;border-radius:99px;font-weight:700;background:var(--sub);color:var(--mu)}.ls.up{background:var(--upb);color:var(--up)}.ls.dn{background:var(--dnb);color:var(--dn)}
.lg{flex:none;width:30px;height:30px;object-fit:contain}@media(prefers-color-scheme:dark){.lg{background:#fff;border-radius:50%;padding:3px}}
.ln.auto{border-style:dashed}
.lbn{margin:4px 12px 8px;padding:10px 12px;border-radius:14px;background:var(--dnb);font-size:13px;line-height:1.4}
.tabs{display:flex;gap:8px;padding:14px 16px 0}.tab{flex:1;font:inherit;font-weight:700;border:0;border-radius:12px;padding:10px;background:var(--card);color:var(--mu);border:1px solid var(--bd)}
.tab.on{background:linear-gradient(135deg,#c026d3,#ff7a18);color:#fff;border-color:transparent}
.days{display:flex;gap:8px;padding:12px 16px 4px;flex-wrap:wrap}
.gc{background:var(--card);border-radius:18px;margin:10px 12px;overflow:hidden;box-shadow:0 8px 24px var(--sh)}
.gh{display:flex;align-items:center;gap:8px;padding:12px 14px;font-weight:800;border-bottom:1px solid var(--bd)}.gh .tp{margin-left:auto;font-weight:600;font-size:13px;color:var(--mu)}
.th2{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--sub);font-weight:700;font-size:13px}
.pr{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--bd)}.pr:last-child{border-bottom:0}
.fr,.cl{display:flex;gap:14px;text-align:center}.fr div,.cl b{width:44px}.cl{margin-left:auto}.cl b{font-size:11px;color:var(--mu)}.fb{font-weight:800;font-size:20px;color:var(--l)}
button,select,th.sb,tbody td:first-child{cursor:pointer}
button,.chip,.tab,th,.n,.hb,.x{transition:background .12s,color .12s,border-color .12s,box-shadow .12s,transform .12s}
tbody tr:hover td{background-image:linear-gradient(rgba(124,58,237,.10),rgba(124,58,237,.10))}
tbody td:first-child:hover .n{text-decoration:underline;color:var(--m)}
th.sb:hover{background:var(--sub);text-decoration:underline}
.chip:not(.on):hover,.tab:not(.on):hover,.bar select:hover{border-color:var(--m);color:var(--m)}
.hb:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(0,0,0,.3)}
.x:hover{background:rgba(255,255,255,.45)}
th,td{padding:9px 8px}
th{white-space:normal;line-height:1.2;vertical-align:bottom}th:first-child{text-align:left}
.pc{min-width:0;padding:3px 7px}.ls{min-width:0;padding:3px 8px}.ln{width:54px}
.fr .fb:first-child,.cl b:first-child{color:var(--up)}.fr .fb:last-child,.cl b:last-child{color:var(--a)}
</style></head><body>
<div class="hero"><div class="hg"><h1>PRA Props</h1><button class="hb" onclick="help()">? Help</button><div class="sea" id="se">Loading…</div><div class="upd" id="ch"></div></div><input id="q" placeholder="Search a player"></div>
<div class="tabs"><button class="tab on" id="t1" onclick="tab(1)">Players</button><button class="tab" id="t2" onclick="tab(2)">Bets</button></div>
<div id="v1">
<div class="bar">
<select id="tm"><option value="">Teams</option></select><button class="chip" id="td" onclick="today()">Today</button><label>Top <input id="tp" type="number" value="50"></label><label>Min GP <input id="mg" type="number" value="10"></label></div>
<div id="lb" class="lbn" style="display:none"></div>
<div class="panel"><div id="w"><table><thead id="th"></thead><tbody id="b"></tbody></table></div><div id="em" class="mu" style="padding:14px 16px"></div></div>
<div class="note" id="nt">These are past results, not predictions, and small samples early in the season are unreliable. Floor 90 is the PRA a player reached in at least 90% of games. Allowed is the PRA the next opponent gives up per game (#1 gives up the most). Tap a name for full details.</div>
</div>
<div id="v2" style="display:none"></div>
<div id="o" onclick="if(event.target==this)this.style.display='none'"><div class="sh" id="sh"></div></div>
<script>
const $=i=>document.getElementById(i);
let D,T,S={k:5,d:-1},L={},TM='',TD=false,TODAY='';
try{L=JSON.parse(localStorage.getItem('lines')||'{}')}catch(e){}
const et=s=>{try{const d=new Date(s.replace(' UTC','Z').replace(' ','T'));return d.toLocaleString('en-US',{timeZone:'America/New_York',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+' ET'}catch(e){return s}};
const sn=s=>{const a=String(s||'').trim().split(/\s+/);return a.length<2||/\./.test(a[0])?s:a[0][0]+'. '+a.slice(1).join(' ')};
const LG={GSW:'gs',NYK:'ny',SAS:'sa',NOP:'no',UTA:'utah',WAS:'wsh'};
const logo=t=>`<img class="lg" alt="${t}" src="https://a.espncdn.com/i/teamlogos/nba/500/${LG[t]||String(t).toLowerCase()}.png" onerror="fb(this)">`;
function fb(i){const t=i.alt;i.outerHTML=`<div class="av" style="background:hsl(${hue(t)} 72% 46%)">${t}</div>`}
const typed=p=>L[p.id]!==undefined&&L[p.id]!=='';
const lv=p=>typed(p)?L[p.id]:(p.line??'');
const f=(x,n=1)=>x==null?'–':(+x).toFixed(n);
const hue=s=>[...String(s||'?')].reduce((a,c)=>a*31+c.charCodeAt(0),7)%360;
const pc=(a,l)=>{const c=a.filter(v=>v>l).length,n=a.length,p=Math.round(100*c/n);return`<span class="pc ${p>=60?'up':p<=40?'dn':''}">${p}%</span>`};
const pd=s=>{if(!s)return null;const d=new Date(/T\d\d:\d\d(Z|[+-]\d\d:?\d\d)?$/.test(s)&&!/:\d\d:\d\d/.test(s)?s.replace(/Z$/,'')+':00'+(/Z$/.test(s)?'Z':''):s);return isNaN(d)?null:d};
const gday=n=>{const d=pd(n.utc);return d?d.toLocaleDateString('en-CA',{timeZone:'America/New_York'}):n.date};
const gtime=n=>{const d=pd(n.utc);return d?d.toLocaleTimeString('en-US',{timeZone:'America/New_York',hour:'numeric',minute:'2-digit'}):''};
const glab=n=>{const d=pd(n.utc)||pd(n.date+'T12:00Z');if(!d)return'–';return(gday(n)==TODAY?'Today':d.toLocaleDateString('en-US',{timeZone:'America/New_York',month:'short',day:'numeric'}))+(n.utc&&gtime(n)?' '+gtime(n):'')};
const plays=p=>p.next&&gday(p.next)==TODAY;
const O=p=>p.next&&T[p.next.opp];
const tr=p=>p.l5>=p.avg*1.15?'up':p.l5<=p.avg*.85?'dn':'';
const spark=p=>{const v=p.pra.slice(-5),m=Math.max(...v,p.avg)*1.08;return`<svg width="70" height="26" viewBox="0 0 70 26">`+v.map((x,i)=>`<rect x="${i*14}" y="${26-x/m*26}" width="11" height="${x/m*26}" rx="3" fill="var(${x>=p.avg?'--up':'--dn'})"/>`).join('')+`<line x1="0" x2="70" y1="${26-p.avg/m*26}" y2="${26-p.avg/m*26}" stroke="var(--fg)" stroke-width=".8" stroke-dasharray="2 2" opacity=".55"/></svg>`};
const C=[
{l:'Player',g:p=>p.name,r:(p,i)=>`<div class="who"><span class="no">${i+1}</span>${logo(p.team)}<div><div class="n">${sn(p.name)}</div><div class="mu">${p.gp} games</div></div></div>`},
{l:'Line',c:'gt',r:p=>`<input class="ln${!typed(p)&&p.line!=null?' auto':''}" inputmode="decimal" placeholder="–" value="${lv(p)}" oninput="this.classList.remove('auto');ln(${p.id},this.value)" onchange="if(!this.value.trim())draw()">`},
{l:'Over',c:'gt',r:p=>`<span id="s${p.id}"></span>`},
{l:'Over L5',c:'gt',r:p=>`<span id="t${p.id}"></span>`},
{l:'Lean',c:'gt',r:p=>`<span id="l${p.id}"></span>`},
{l:'Avg',c:'ga',g:p=>p.avg,r:p=>`<span class="av2">${f(p.avg)}</span>`},
{l:'L5',c:'gf',g:p=>p.l5,r:p=>f(p.l5)},
{l:'Last 5',c:'gf',r:spark},
{l:'Floor 90',c:'gl',g:p=>p.f90,r:p=>p.f90},{l:'Floor 80',c:'gl',g:p=>p.f80,r:p=>p.f80},
{l:'Min',c:'gm',g:p=>p.min,r:p=>f(p.min)},
{l:'Next',c:'gn',g:p=>p.next&&p.next.opp,r:p=>p.next?`<span class="mu">${p.next.home?'vs':'@'}</span> <b>${p.next.opp}</b>`:'–'},
{l:'Date',c:'gn',g:p=>p.next&&(p.next.utc||p.next.date),r:p=>p.next?glab(p.next):'–'},
{l:'Allowed',c:'gn',g:p=>O(p)&&O(p).allowed,r:p=>O(p)?`${f(O(p).allowed)} <span class="rk ${O(p).rank<=10?'up':O(p).rank>=21?'dn':''}">#${O(p).rank}</span>`:'–'}];
let BD='';
const r5=x=>Math.floor(x/5)*5;
function tab(n){$('v1').style.display=n==1?'':'none';$('v2').style.display=n==2?'':'none';$('t1').classList.toggle('on',n==1);$('t2').classList.toggle('on',n==2);if(n==2)bets()}
function setDay(d){BD=d;bets()}
function games(){
if(D.schedule&&D.schedule.length)return D.schedule.map(g=>({date:g.date,utc:g.utc,home:g.home,away:g.away}));
const m={};D.players.forEach(p=>{if(!p.next)return;const d=gday(p.next),h=p.next.home?p.team:p.next.opp,a=p.next.home?p.next.opp:p.team,k=d+h+a;m[k]=m[k]||{date:d,utc:p.next.utc,home:h,away:a}});
return Object.values(m).sort((x,y)=>String(x.utc||x.date).localeCompare(String(y.utc||y.date)))}
function lineFor(p,g){const u=L[p.id];if(u!==undefined&&u!==''){const v=parseFloat(u);if(!isNaN(v))return{l:v,src:'your line'}}
const b=p.lines_by_date&&p.lines_by_date[g.date];if(b)return{l:b.line,src:b.book};
if(p.line!=null&&p.next&&gday(p.next)==g.date)return{l:p.line,src:p.line_book||'auto'};return null}
function picks(g){const o=[];[g.away,g.home].forEach(t=>D.players.filter(p=>p.team==t).forEach(p=>{const lf=lineFor(p,g);if(!lf)return;
const r=lean(p,lf.l,{opp:t==g.home?g.away:g.home,home:t==g.home,utc:g.utc,date:g.date});if(r&&r.v!='Neither')o.push({p,t,l:lf.l,src:lf.src,r})}));
return o.sort((a,b)=>Math.abs(b.r.p-.5)-Math.abs(a.r.p-.5))}
function bets(){
const tmw=new Date(Date.parse(TODAY+'T12:00Z')+864e5).toISOString().slice(0,10),G=games().filter(g=>(g.date==TODAY||g.date==tmw)&&!(pd(g.utc)&&pd(g.utc)<=new Date())),days=[TODAY,tmw].filter(d=>G.some(g=>g.date==d));
if(!days.length){$('v2').innerHTML='<div class="note" style="padding-top:16px">No upcoming games today or tomorrow (games that have already started are hidden).</div>';return}
if(!days.includes(BD))BD=days.includes(TODAY)?TODAY:days[0];
const lab=d=>d==TODAY?'Today':d==tmw?'Tomorrow':new Date(d+'T12:00Z').toLocaleDateString('en-US',{timeZone:'UTC',weekday:'short',month:'short',day:'numeric'});
const rows=t=>{const a=D.players.filter(p=>p.team==t&&p.f90>=10).sort((x,y)=>r5(y.f90)-r5(x.f90)||r5(y.f80)-r5(x.f80)||y.avg-x.avg);
return a.length?a.map(p=>`<div class="pr"><div><div class="n">${sn(p.name)}</div><div class="mu">${p.gp} games, avg ${f(p.avg)}</div></div><div class="fr"><div class="fb">${r5(p.f90)}</div><div class="fb">${r5(p.f80)}</div></div></div>`).join(''):'<div class="pr"><span class="mu">No players with a Floor 90 of 10 or more</span></div>'};
const pk=g=>{const a=picks(g);return`<div class="th2">Lean picks (${a.length})</div>`+(a.length?a.map(x=>`<div class="pr"><div><div class="n">${sn(x.p.name)}</div><div class="mu">${x.t}, line from ${x.src}</div></div><span class="ls ${lc(x.r.v)}">${x.r.v} ${x.l}</span></div>`).join(''):'<div class="pr"><span class="mu">No Over or Under picks for this game (or no lines yet)</span></div>')};
const day=G.filter(g=>g.date==BD),tot=day.reduce((s,g)=>s+picks(g).length,0);
$('v2').innerHTML='<div class="days">'+days.map(d=>`<button class="chip ${d==BD?'on':''}" onclick="setDay('${d}')">${lab(d)}</button>`).join('')+`</div><div class="note" style="padding:4px 16px 0"><b>${tot}</b> lean picks across ${day.length} games.</div>`+
day.map(g=>`<div class="gc"><div class="gh">${logo(g.away)}<span>${g.away} @ ${g.home}</span>${logo(g.home)}<span class="tp">${g.utc&&gtime(g)?gtime(g)+' ET':''}</span></div>${pk(g)}
<div class="th2">${logo(g.away)} ${g.away}<span class="cl"><b>F90</b><b>F80</b></span></div>${rows(g.away)}<div class="th2">${logo(g.home)} ${g.home}<span class="cl"><b>F90</b><b>F80</b></span></div>${rows(g.home)}</div>`).join('')+
'<div class="note">The two numbers by each player are his Floor 90 (F90) and Floor 80 (F80) rounded down to the nearest 5 (42 becomes 40, 39 becomes 35, minimum 10). Floor 90 is the PRA he reached or beat in at least 90% of his games, Floor 80 in at least 80%. Lean picks use the same rule as the Lean column, with the line from PropLine (or the line you typed). Past results, not predictions.</div>'}
function today(){TD=!TD;$('td').classList.toggle('on',TD);draw()}
function srt(i){S=S.k==i?{k:i,d:-S.d}:{k:i,d:(i==0||i==11||i==12)?1:-1};draw()}
const dd=(a,b)=>Math.round((Date.parse(b+'T12:00Z')-Date.parse(a+'T12:00Z'))/864e5);
const erf=x=>{const s=x<0?-1:1;x=Math.abs(x);const t=1/(1+.3275911*x);return s*(1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-x*x))};
const cdf=z=>.5*(1+erf(z/Math.SQRT2));
const LP=.64,LZ=.40,LH=.60,LGP=12,LCV=.30,LFAR=.75;
let LM=null;
function lean(p,l,nx){const N=nx||p.next;
if(isNaN(l))return null;
if(p.gp<LGP)return{v:'Neither',p:.5,w:['Fewer than '+LGP+' games, sample too small']};
if(LM==null){const a=Object.values(T).map(x=>x.allowed);LM=a.reduce((x,y)=>x+y,0)/a.length}
const w=[],n=p.pra.length,sd=Math.max(p.sd||0,3),ppm=p.min>0?p.avg/p.min:0;
let mu=.5*p.avg+.3*(p.l10??p.avg)+.2*p.l5;
w.push('Base '+f(mu)+' (mix of season '+f(p.avg)+', last 10 and last 5 averages)');
const adj=(t,v)=>{if(Math.abs(v)>=.2){mu+=v;w.push((v>0?'+':'')+f(v)+' '+t)}};
adj('minutes: last 5 '+f(p.l5min)+' vs season '+f(p.min),(p.l5min-p.min)*ppm*.5);
const o=N&&T[N.opp];if(o)adj('opponent '+N.opp+' (#'+o.rank+' in PRA allowed)',p.avg*((o.allowed-LM)/LM)*.5);
if(N){const g=p.games[p.games.length-1],ld=(nx&&p.next&&gday(p.next)<gday(nx))?gday(p.next):(g&&g.d);
if(p.b2b&&ld&&dd(ld,gday(N))==1)adj('back-to-back: avg '+f(p.b2b.avg)+' on 0 days rest',(p.b2b.avg-p.avg)*.3);
const ha=N.home?p.home:p.away;if(ha!=null)adj((N.home?'home':'away')+' avg '+f(ha),(ha-p.avg)*.3)}
const pz=cdf((mu-l)/sd),over=p.pra.filter(v=>v>l).length,pe=(over+5)/(n+10),pr=.6*pz+.4*pe;
w.push('Expected PRA '+f(mu)+' vs line '+l+', typical swing '+f(sd));
w.push('History: over this line in '+over+' of '+n+' games ('+Math.round(100*over/n)+'%)');
const gz=(mu-l)/sd,os=over/n;w.push('Rule: Over needs my estimate, his season avg and his last 5 avg all clearly above the line, over it in 60%+ of his games, a steady scorer, minutes not dropping and a line close to his average; Under is the reverse');
let v='Neither';
if(pr>=LP&&p.avg>=l&&p.l5>=l&&gz>=LZ&&os>=LH)v='Over';else if(pr<=1-LP&&p.avg<=l&&p.l5<=l&&gz<=-LZ&&os<=1-LH)v='Under';
if(v!='Neither'){const g=[],dm=p.l5min-p.min;
if(sd/p.avg>LCV)g.push('his games vary a lot (swing '+f(sd)+' on an average of '+f(p.avg)+')');
if(Math.abs(l-p.avg)>LFAR*sd)g.push('the line '+l+' is far from his average '+f(p.avg)+', so books may know about an injury or role change');
if((v=='Over'&&dm<-1.5)||(v=='Under'&&dm>1.5))g.push('his minutes are trending the wrong way ('+f(p.l5min)+' last 5 vs '+f(p.min)+')');
if(g.length){w.push('No lean because '+g.join('; '));v='Neither'}}
return{v,p:pr,w}}
const lc=x=>x=='Over'?'up':x=='Under'?'dn':'';
const lt=r=>r.v=='Neither'?'-':r.v;
function lb(r,l){if(!r)return'<div class="hp" style="--c:var(--mu)"><span>Type a line in the table to see my lean for this player.</span></div>';
return`<div class="hp" style="--c:var(--${r.v=='Over'?'up':r.v=='Under'?'dn':'mu'})"><b>Lean at ${l}: ${r.v=='Neither'?'No lean':r.v}</b><span>${r.w.join('<br>')}</span></div>`}
function res(p){const l=parseFloat(lv(p)),a=$('s'+p.id),b=$('t'+p.id),c=$('l'+p.id);if(!a)return;
if(isNaN(l)){a.innerHTML=b.innerHTML=c.innerHTML='<span class="mu">–</span>'}else{a.innerHTML=pc(p.pra,l);b.innerHTML=pc(p.pra.slice(-5),l);const r=lean(p,l);c.innerHTML=`<span class="ls ${lc(r.v)}">${lt(r)}</span>`}}
function save(){try{localStorage.setItem('lines',JSON.stringify(L))}catch(e){}}
function ln(id,v){if(String(v).trim()==='')delete L[id];else L[id]=v;save();res(D.players.find(p=>p.id==id))}
function resetLines(){if(!confirm('Remove all the lines you typed and go back to the automatic lines?'))return;L={};try{localStorage.removeItem('lines')}catch(e){}$('o').style.display='none';draw();if($('v2').style.display!='none')bets()}
function draw(){
$('th').innerHTML='<tr>'+C.map((c,i)=>`<th class="${c.g?'sb':''} ${S.k==i?'on':''} ${c.c||''}"${c.g?` onclick="srt(${i})" title="Click to sort"`:''}>${c.l}${S.k==i?(S.d<0?' ↓':' ↑'):''}</th>`).join('')+'</tr>';
const q=$('q').value.toLowerCase();
const mg=+$('mg').value,N=+$('tp').value||50;
const base=D.players.filter(p=>(!TM||p.team==TM)&&(!TD||plays(p))&&p.name.toLowerCase().includes(q)).sort((x,y)=>y.avg-x.avg);
let a=base.filter(p=>p.gp>=mg),fill=0;
if(a.length<N&&!q&&!TM){fill=Math.min(N-a.length,base.length-a.length);a=a.concat(base.filter(p=>p.gp<mg).slice(0,fill)).sort((x,y)=>y.avg-x.avg)}
a=a.slice(0,N);
const g=C[S.k].g;a.sort((x,y)=>{const u=g(x),v=g(y);if(u==null)return 1;if(v==null)return-1;return(u>v?1:u<v?-1:0)*S.d});
$('b').innerHTML=a.map((p,r)=>{try{return '<tr>'+C.map((c,i)=>`<td class="${c.c||''}"${i==0?` onclick="det(${p.id})" title="Click for details"`:''}>${c.r(p,r)}</td>`).join('')+'</tr>'}catch(e){console.log(e);return ''}}).join('');
a.forEach(res);$('em').textContent=a.length?(fill?'Only '+(a.length-fill)+' players have '+mg+'+ games, so '+fill+' players with fewer games were added to fill the list.':''):(TD?'No players with a game today in the data. The data was last updated '+et(D.updated)+'.':'No players match.')}
function det(id){const p=D.players.find(x=>x.id==id),l=parseFloat(lv(p)),G=p.games,has=!isNaN(l),mx=Math.max(...G.map(x=>x.pra),has?l:0)*1.12,W=340,H=140,bw=W/G.length;
const bars=G.map((x,i)=>`<rect x="${i*bw+3}" y="${H-x.pra/mx*H}" width="${bw-6}" height="${x.pra/mx*H}" rx="4" fill="${has?(x.pra>l?'var(--up)':'var(--dn)'):'var(--a)'}"/><text x="${i*bw+bw/2}" y="${Math.max(10,H-x.pra/mx*H-3)}" text-anchor="middle" font-size="9.5" font-weight="700" fill="var(--fg)">${x.pra}</text>`).join('');
const ly=has?`<line x1="0" x2="${W}" y1="${H-l/mx*H}" y2="${H-l/mx*H}" stroke="var(--fg)" stroke-width="1.5" stroke-dasharray="4 3"/><text x="${W-2}" y="${Math.max(10,H-l/mx*H-4)}" text-anchor="end" font-size="9.5" font-weight="700" fill="var(--fg)">line ${l}</text>`:'';
const ls=has?lean(p,l):null;const tl=(a,b,c)=>`<div class="tl" style="--c:var(${c})"><div>${a}</div><div>${b}</div></div>`,sb=s=>s?f(s.avg)+' ('+s.n+')':'n/a';
$('sh').innerHTML=`<div class="hd"><div><b>${p.name}</b><div style="opacity:.9">${p.team}, ${p.gp} games${p.line_book?', line from '+p.line_book+(p.line_books>1?' (+'+(p.line_books-1)+' more books)':''):''}</div></div><button class="x" onclick="$('o').style.display='none'">✕</button></div><div class="bd">
<div class="g">${tl('Std dev',f(p.sd),'--a')}${tl('Low to high',p.mn+' to '+p.mx,'--a')}${tl('L5 minutes',f(p.l5min),'--m')}${tl('Home avg',f(p.home),'--t')}${tl('Away avg',f(p.away),'--t')}${tl('Back-to-back',sb(p.b2b),'--f')}${tl('2+ days rest',sb(p.r2),'--f')}${tl('Floor 90',p.f90,'--l')}${tl('Floor 80',p.f80,'--l')}</div>
${lb(ls,l)}
<svg viewBox="0 0 ${W} ${H}" width="100%">${bars}${ly}</svg><div class="mu" style="margin:4px 0 12px">Last ${G.length} games, oldest to newest${has?'. Dashed line is your line, '+l:''}</div>
<table><tr><th>Date</th><th>Opp</th><th>Min</th><th>PTS</th><th>REB</th><th>AST</th><th>PRA</th></tr>`+
[...G].reverse().map(x=>`<tr><td>${x.d.slice(5)}</td><td>${x.h?'vs':'@'} ${x.o}</td><td>${x.m}</td><td>${x.p}</td><td>${x.r}</td><td>${x.a}</td><td><b>${x.pra}</b></td></tr>`).join('')+'</table></div>';
$('o').style.display='flex'}
function help(){
const I=[['--t','Player','Rank number, a colored team badge, short name and games played. Tap the name for details: last 15 games, a chart with your line, std dev, home and away averages, back-to-back and rested averages, last 5 minutes, floors and the Lean breakdown.'],
['--t','Line, Over, Over L5','Type the sportsbook line for a player (for example 38.5). Lines fill in automatically (dashed box) when a free PropLine key is set up in your repo. Over is how often he went over it this season, and Over L5 how often in his last 5 games (60% there means 3 of his last 5). Green is 60% or more, red is 40% or less. Your lines are saved on your phone.'],
['--t','Lean (my suggestion)','Shows Over or Under once you type a line, or - when it is too close to call. I estimate his PRA from a mix of his season, last 10 and last 5 averages, adjusted for his minutes trend, the opponent, a back-to-back and home or away. I compare that with your line using how much he normally swings (std dev) and how often he went over this line. I only say Over when my estimate, his season average and his last 5 average are all clearly above the line, he went over it in more than half his games, he has 12 or more games, his scoring is steady, his minutes are not dropping, and the line is close to his average (a line far from his average usually means the books know something, such as an injury). Under is the reverse. It does not know about injuries or lineup changes. Tap a name to see how I got it.'],
['--a','Avg','His mean PRA over the games he played this season.'],
['--f','L5 and Last 5 bars','L5 is his average over the last 5 games. The small bars show each of those games: green at or above his season average, red below, dashed line is the average.'],
['--l','Floor 90 and Floor 80','The PRA he reached or beat in at least 90% or 80% of his games. If your line is below his Floor 80, he cleared it in 80% or more of games. If your line is above his Avg, he usually falls short of it.'],
['--m','Minutes','His average minutes this season. More minutes usually means more PRA. Tap a name to see his last 5 minutes. If they dropped, recent numbers may overstate what he will do.'],
['--n','Next, Date, Allowed','Next is who he plays next (vs is home, @ is away). Date is when, with tip-off time in Eastern time. Allowed is how many PRA that team gives up per game to all opposing players, with its rank: #1 gives up the most (green, 1 to 10), #30 the least (red, 21 to 30). It covers the whole team, not one position.'],
['--l','Bets tab','Lists the games for today and tomorrow that have not started yet (a game disappears when it tips off). Each game starts with its Over and Under lean picks (same rule as the Lean column, using the line from PropLine or the one you typed), then each team\'s players with their Floor 90 and Floor 80 rounded down to the nearest 5, for example 42 becomes 40 and 39 becomes 35, minimum 10. Players whose Floor 90 is below 10 are left out. Use the day buttons to switch between days. It is a quick list of the safest past-performance levels, not a prediction.'],
['--a','Search, team, Today, Top, Min GP','Search a player by name. The team list marks teams with a game today with 🏀. Today shows only players whose team plays today (Eastern date). Top is how many rows to show, Min GP hides players below that many games played. If fewer than Top players qualify, players with fewer games are added to fill the list. Tap a column header to sort, tap again to reverse.']];
$('sh').innerHTML=`<div class="hd"><div><b>How to read this</b><div style="opacity:.9">Past stats, step by step</div></div><button class="x" onclick="$('o').style.display='none'">✕</button></div><div class="bd">`+
I.map(x=>`<div class="hp" style="--c:var(${x[0]})"><b>${x[1]}</b><span>${x[2]}</span></div>`).join('')+
`<div class="hh">A quick routine</div><div class="hp" style="--c:var(--up)"><span>1. Type the line. 2. Check Over and Over L5. 3. Compare the line with his floors. 4. Check form (L5, bars) and minutes. 5. Check the opponent rank. 6. Check injury and lineup news elsewhere, because this page does not have it and it often matters most.</span></div>
<div class="hh">Keep in mind</div><div class="hp" style="--c:var(--dn)"><span>These are past results, not predictions. Sportsbooks already price in most of this. Early in the season the samples are small. At typical odds of -110 you need to win about 52.4% of bets just to break even, so a 60% hit rate over 5 games is not a proven edge. Only bet what you can afford to lose.</span></div><div class="hh">Your typed lines</div><div class="hp" style="--c:var(--t)"><span>Lines you type are saved on this phone and replace the automatic lines. Clear a single box to bring its automatic line back, or clear them all: <button class="chip" onclick="resetLines()">Clear my typed lines</button></span></div></div>`;
$('o').style.display='flex'}
setInterval(()=>{if(D&&$('v2').style.display!='none')bets()},60000);
const NOTE0=$('nt').textContent;
function apply(d,first){
D=d;T=d.teams;LM=null;
$('se').textContent='NBA regular season '+d.season;
$('ch').innerHTML=`<span>Updated ${et(d.updated)}</span>`;
$('nt').textContent=NOTE0+(d.lines_source?' Lines are filled in automatically from '+d.lines_source+' ('+d.lines_count+' players). A dashed box is an automatic line. Type over it to change it; your typed lines are saved.':'');
const lb=$('lb');if(!d.lines_source&&d.lines_status){lb.style.display='block';lb.textContent='Automatic lines are not available: '+d.lines_status}else lb.style.display='none';
TODAY=new Date().toLocaleDateString('en-CA',{timeZone:'America/New_York'});

const sel=$('tm'),cur=sel.value;
if(sel.options)while(sel.options.length>1)sel.remove(1);
[...new Set(d.players.map(p=>p.team))].sort().forEach(t=>sel.add(new Option(t+(pt[t]?' 🏀':''),t)));

let busy=false;
function refresh(){
if(busy)return;const a=document.activeElement;if(a&&a.classList&&a.classList.contains('ln'))return;
busy=true;
fetch('data.json?'+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(d=>{
const t=new Date().toLocaleDateString('en-CA',{timeZone:'America/New_York'});
if(!D||d.updated!==D.updated||t!==TODAY)apply(d,!D)}).catch(e=>{if(!D)$('se').textContent='No data yet ('+e+')'}).then(()=>{busy=false})}
