name: Update NBA stats
on:
  schedule:
    # Hourly from 6:17 AM to 11:17 PM EST (UTC 11:17 to 04:17; one hour later on the clock in daylight saving time).
    # The :17 minute avoids GitHub's busiest start time at the top of the hour.
    - cron: "17 11-23,0-4 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-stats
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install nba_api requests
      - run: python update_stats.py
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - name: Commit if changed
        run: |
          git config user.name "stats-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "Update data" && git push)
