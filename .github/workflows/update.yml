name: Update NBA stats
on:
  schedule:
    # Every hour on the hour, 24 times a day (1:00 AM, 2:00 AM ... 12:00 AM Eastern).
    # US Eastern is a whole number of hours from UTC, so the top of every UTC hour is also the top of an Eastern hour.
    - cron: "0 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-stats
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install nba_api requests
      - run: python update_stats.py
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - name: Commit if changed
        run: |
          git config user.name "stats-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "Update data" && git push)
